    <style>

    body {
        text-align: center;
        background: #111;
        padding: 2.5em 4.5em;
        margin: 0;
    }

    img {
        max-width: 100%;
        height: auto;
    }

    .banner {
        max-width: 30em;
        margin: 0 auto;
    }

    .title {
        text-align: center;
        font-size: 24px;
        color: #eee;
        font-weight: bold;
    }

    .desc {
        text-align: center;
        font-size: 16px;
        color: #eee;
    }

    .buttons {
        display: grid;
        grid-template-rows: repeat(auto-fit, minmax(50px, 1fr));
        grid-gap: 24px;
    }

    .button-normal,
    .button-polyfill {
        height: 100%;
        width: 100%;
        display: inline-block;
    }

    button {
        width: 100%;
        max-width: 260px;
        border: 1px solid #666;
        background-color: #222;
        color: #eee;
        font-size: 110%;
        line-height: 1.75;
        cursor: pointer;
        padding: 0.4em;
        transition-duration: 200ms;
        user-select: none;
        -webkit-appearance: button;
        text-transform: none;
    }

    button:hover {
        background-color: #333;
        cursor: pointer;
    }

    #password-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #111;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .pwd-box {
        background: #1a1a1a;
        padding: 30px;
        border: 1px solid #444;
        border-radius: 4px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        max-width: 320px;
        width: 80%;
    }

    .pwd-box h3 {
        color: #eee;
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 18px;
    }

    .pwd-box input {
        width: 100%;
        padding: 10px;
        background: #222;
        border: 1px solid #555;
        color: #eee;
        font-size: 16px;
        box-sizing: border-box;
        margin-bottom: 15px;
        text-align: center;
    }

    .pwd-box input:focus {
        border-color: #BB489A;
        outline: none;
    }

    .pwd-box button {
        max-width: 100%;
        background: #222;
        border: 1px solid #BB489A;
        color: #BB489A;
    }

    .pwd-box button:hover {
        background: #BB489A;
        color: #fff;
    }

    .error-msg {
        color: #ff4d4d;
        font-size: 14px;
        margin-top: 10px;
        display: none;
    }
    </style>
</head>

<body>

<div id="password-overlay">
    <div class="pwd-box">
        <h3>PWD?</h3>
        <input type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.keyCode==13) checkPassword()">
        <button onclick="checkPassword()">OK</button>
        <div id="error-tips" class="error-msg">密码错误</div>
    </div>
</div>

    <p>DoL-Lyra</p>

<div class="desc">

    <a href="https://github.com/DoL-Lyra/Lyra" style="color:#BB489A;">原 Github 仓库</a>
</div>
<div class="title">
    <p>请根据你使用的设备选择对应的模式</p>
</div>
<div class="desc">
    <p>普通模式适用于高版本浏览器内核</p>
    <p>如果无法正常加载模组管理器，请选择兼容模式</p>
</div>

<br>
<div class="buttons">
    <div class="button-normal">
        <button onclick="location.href='dol.html'">普通模式</button>
    </div>

    <div class="button-polyfill">
        <button onclick="location.href='dol-polyfill.html'">兼容模式</button>
    </div>
</div>

<br>
<div class="title">
    <p>伪装模式（党史学习 × Word）</p>
</div>
<div class="desc">
    <p>将游戏界面伪装成「党史学习读本 + Microsoft Word」外观，隐藏立绘与图片</p>
    <p>进入游戏后也可随时切换：右下角「伪装」按钮，或 <b>Ctrl+Shift+D</b></p>
    <p>紧急掩护：按 <b>`</b>（反引号）或连按两次 Esc（仅替换侧栏与正文，Word 外壳不变）</p>
</div>
<br>
<div class="buttons">
    <div class="button-normal">
        <button onclick="location.href='dol.html?disguise=1'" title="普通模式 + 启动即伪装">普通模式 · 伪装启动</button>
    </div>
    <div class="button-polyfill">
        <button onclick="location.href='dol-polyfill.html?disguise=1'" title="兼容模式 + 启动即伪装">兼容模式 · 伪装启动</button>
    </div>
</div>

<script>
function checkPassword() {
    var input = document.getElementById("pwd-input").value;
    var tips = document.getElementById("error-tips");
    
    if (input === "robin") {
        document.getElementById("password-overlay").style.display = "none";
        localStorage.setItem("page_auth", "passed");
    } else {
        tips.style.display = "block";
        document.getElementById("pwd-input").value = "";
    }
}

window.onload = function() {
    if (localStorage.getItem("page_auth") === "passed") {
        document.getElementById("password-overlay").style.display = "none";
    }
}
</script>
